<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Main Showcase Container -->
  <rect x="20" y="20" width="560" height="440" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)" />

  <!-- Background Grid Lines -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.4">
    <line x1="20" y1="100" x2="580" y2="100" />
    <line x1="20" y1="180" x2="580" y2="180" />
    <line x1="20" y1="260" x2="580" y2="260" />
    <line x1="20" y1="340" x2="580" y2="340" />
    <line x1="120" y1="20" x2="120" y2="460" />
    <line x1="220" y1="20" x2="220" y2="460" />
    <line x1="320" y1="20" x2="320" y2="460" />
    <line x1="420" y1="20" x2="420" y2="460" />
    <line x1="520" y1="20" x2="520" y2="460" />
  </g>

  <!-- Video Stream Header simulation -->
  <rect x="40" y="40" width="520" height="40" rx="10" fill="#1E293B" />
  <circle cx="60" cy="60" r="5" fill="#EF4444" />
  <circle cx="76" cy="60" r="5" fill="#F59E0B" />
  <circle cx="92" cy="60" r="5" fill="#10B981" />
  <text x="120" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Webcam Stream: ISL Gesture Recognition [Active 30 FPS]</text>
  <rect x="440" y="50" width="105" height="20" rx="6" fill="#10B981" fill-opacity="0.2" />
  <circle cx="452" cy="60" r="4" fill="#10B981" />
  <text x="462" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#10B981">LIVE AI TRACK</text>

  <!-- Target Hand Gesture Area -->
  <g transform="translate(140, 110)">
    <!-- Hand Silhouette -->
    <path d="M 120 230 C 100 210, 80 180, 80 140 C 80 90, 100 60, 120 50 C 130 80, 140 100, 150 90 C 160 70, 170 50, 185 45 C 195 70, 200 90, 210 80 C 220 60, 230 55, 245 55 C 255 75, 255 100, 265 95 C 275 80, 285 75, 295 85 C 305 105, 305 150, 295 180 C 285 220, 250 250, 210 260 Z" fill="#3B82F6" fill-opacity="0.15" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- MediaPipe Hand Skeleton (21 Landmarks Model) -->
    <!-- Wrist -->
    <circle cx="210" cy="245" r="6" fill="#06B6D4" filter="url(#glow)" />
    <!-- Thumb line -->
    <path d="M210 245 L170 210 L140 170 L115 130 L95 100" stroke="#38BDF8" stroke-width="2.5" fill="none" />
    <circle cx="170" cy="210" r="4.5" fill="#38BDF8" />
    <circle cx="140" cy="170" r="4.5" fill="#38BDF8" />
    <circle cx="115" cy="130" r="4.5" fill="#38BDF8" />
    <circle cx="95" cy="100" r="5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2" />

    <!-- Index finger -->
    <path d="M210 245 L195 170 L185 125 L175 80 L165 45" stroke="#818CF8" stroke-width="2.5" fill="none" />
    <circle cx="195" cy="170" r="4.5" fill="#818CF8" />
    <circle cx="185" cy="125" r="4.5" fill="#818CF8" />
    <circle cx="175" cy="80" r="4.5" fill="#818CF8" />
    <circle cx="165" cy="45" r="5.5" fill="#FFFFFF" stroke="#6366F1" stroke-width="2" />

    <!-- Middle finger -->
    <path d="M210 245 L215 165 L220 115 L225 70 L225 35" stroke="#A78BFA" stroke-width="2.5" fill="none" />
    <circle cx="215" cy="165" r="4.5" fill="#A78BFA" />
    <circle cx="220" cy="115" r="4.5" fill="#A78BFA" />
    <circle cx="225" cy="70" r="4.5" fill="#A78BFA" />
    <circle cx="225" cy="35" r="5.5" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" />

    <!-- Ring finger -->
    <path d="M210 245 L240 175 L250 130 L258 90 L265 60" stroke="#C084FC" stroke-width="2.5" fill="none" />
    <circle cx="240" cy="175" r="4.5" fill="#C084FC" />
    <circle cx="250" cy="130" r="4.5" fill="#C084FC" />
    <circle cx="258" cy="90" r="4.5" fill="#C084FC" />
    <circle cx="265" cy="60" r="5.5" fill="#FFFFFF" stroke="#C084FC" stroke-width="2" />

    <!-- Pinky finger -->
    <path d="M210 245 L265 195 L280 160 L290 125 L300 95" stroke="#F472B6" stroke-width="2.5" fill="none" />
    <circle cx="265" cy="195" r="4.5" fill="#F472B6" />
    <circle cx="280" cy="160" r="4.5" fill="#F472B6" />
    <circle cx="290" cy="125" r="4.5" fill="#F472B6" />
    <circle cx="300" cy="95" r="5.5" fill="#FFFFFF" stroke="#F472B6" stroke-width="2" />

    <!-- Palm cross-mesh -->
    <path d="M170 210 L195 170 L215 165 L240 175 L265 195" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3,3" fill="none" opacity="0.6" />

    <!-- Gesture bounding box -->
    <rect x="70" y="20" width="250" height="255" rx="14" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="8,6" />
    <rect x="70" y="20" width="16" height="16" fill="none" stroke="#06B6D4" stroke-width="3" />
    <rect x="304" y="20" width="16" height="16" fill="none" stroke="#06B6D4" stroke-width="3" />
    <rect x="70" y="259" width="16" height="16" fill="none" stroke="#06B6D4" stroke-width="3" />
    <rect x="304" y="259" width="16" height="16" fill="none" stroke="#06B6D4" stroke-width="3" />
    <text x="75" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#06B6D4">ISL Hand Pose: Namaste / Welcome</text>
  </g>

  <!-- Left Floating Badge: MediaPipe + OpenCV -->
  <g transform="translate(45, 120)">
    <rect width="145" height="60" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="26" cy="30" r="14" fill="#4F46E5" />
    <!-- Brain / Camera icon -->
    <path d="M20 30 L24 25 L28 35 L32 30" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="48" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">OpenCV + ML</text>
    <text x="48" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94A3B8">21 Landmarks</text>
  </g>

  <!-- Right Floating Badge: Web Speech TTS -->
  <g transform="translate(410, 130)">
    <rect width="150" height="64" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="28" cy="32" r="14" fill="#0EA5E9" />
    <!-- Audio Wave -->
    <path d="M22 32 L22 32 M25 28 L25 36 M28 24 L28 40 M31 29 L31 35 M34 32 L34 32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="50" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Voice Synthesis</text>
    <text x="50" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94A3B8">Web Speech API</text>
  </g>

  <!-- Bottom Floating Output Banner: Real-Time Prediction -->
  <g transform="translate(50, 375)">
    <rect width="500" height="65" rx="16" fill="url(#cardGrad)" stroke="#4F46E5" stroke-width="1.8" filter="url(#glow)" />
    <!-- Icon -->
    <circle cx="42" cy="32" r="18" fill="#4F46E5" />
    <path d="M36 32 L40 37 L48 27" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="72" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">AI RECOGNIZED SIGN (ISL)</text>
    <text x="72" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">HELLO / NAMASTE</text>
    
    <!-- Confidence pill -->
    <rect x="365" y="18" width="115" height="30" rx="15" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1" />
    <circle cx="380" cy="33" r="4.5" fill="#10B981" />
    <text x="392" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#10B981">98.4% MATCH</text>
  </g>
</svg>