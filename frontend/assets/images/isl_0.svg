<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="handGrad_0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow_0" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="6" y="6" width="308" height="228" rx="18" fill="url(#cardBg_0)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow_0)" />

  <!-- Top Badges -->
  <g transform="translate(16, 16)">
    <rect width="80" height="22" rx="6" fill="#10B981" fill-opacity="0.12" />
    <text x="40" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#059669" text-anchor="middle">ISL VERIFIED</text>
  </g>

  <g transform="translate(102, 16)">
    <rect width="105" height="22" rx="6" fill="#64748B" fill-opacity="0.1" />
    <text x="52" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">NUMBERS</text>
  </g>

  <g transform="translate(225, 16)">
    <rect width="78" height="22" rx="6" fill="#0EA5E9" fill-opacity="0.12" />
    <text x="39" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#0EA5E9" text-anchor="middle">1 HAND</text>
  </g>

  <!-- Illustration Viewport -->
  <g transform="translate(16, 48)">
    <rect width="288" height="118" rx="12" fill="#F1F5F9" fill-opacity="0.7" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Subtle Grid -->
    <line x1="20" y1="60" x2="268" y2="60" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="144" y1="10" x2="144" y2="108" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.6" />

    
    <!-- Single Dominant Hand Graphic with Movement Flow -->
    <g transform="translate(75, 12)">
      <!-- Hand Silhouette -->
      <path d="M 40 90 C 40 50, 50 15, 75 10 C 88 7, 100 15, 100 32 L 100 80 C 100 100, 80 105, 55 105 Z" fill="url(#handGrad_0)" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="2" />
      <!-- Finger Landmarks (MediaPipe Keypoints) -->
      <circle cx="75" cy="10" r="5.5" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5" />
      <circle cx="100" cy="32" r="4" fill="#38BDF8" />
      <circle cx="70" cy="55" r="4" fill="#38BDF8" />
      <circle cx="55" cy="100" r="5" fill="#6366F1" />
      <line x1="75" y1="10" x2="100" y2="32" stroke="#6366F1" stroke-width="2" />
      <line x1="100" y1="32" x2="70" y2="55" stroke="#6366F1" stroke-width="2" />
      <line x1="70" y1="55" x2="55" y2="100" stroke="#6366F1" stroke-width="2" />
      <text x="45" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#6366F1">SINGLE HAND ISL</text>
    </g>

    <!-- Movement Arc / Direction Arrow -->
    <path d="M 175 40 C 190 55, 190 85, 175 100" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,3" />
    <polygon points="173,103 180,96 170,96" fill="#6366F1" />
        
  </g>

  <!-- Bottom Details Banner -->
  <g transform="translate(16, 176)">
    <rect width="288" height="48" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Left Symbol Circle -->
    <circle cx="25" cy="24" r="15" fill="#6366F1" />
    <text x="25" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">0</text>

    <!-- Sign Title and Standard -->
    <text x="48" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0F172A">Number 0</text>
    <text x="48" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#64748B">/ˈzɪəroʊ/ (zero) · 1 HAND</text>
  </g>
</svg>