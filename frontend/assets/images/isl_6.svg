<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg_6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="handGrad_6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow_6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="6" y="6" width="308" height="228" rx="18" fill="url(#cardBg_6)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow_6)" />

  <!-- Top Badges -->
  <g transform="translate(16, 16)">
    <rect width="80" height="22" rx="6" fill="#10B981" fill-opacity="0.12" />
    <text x="40" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#059669" text-anchor="middle">ISL VERIFIED</text>
  </g>

  <g transform="translate(102, 16)">
    <rect width="105" height="22" rx="6" fill="#64748B" fill-opacity="0.1" />
    <text x="52" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">NUMBERS</text>
  </g>

  <g transform="translate(225, 16)">
    <rect width="78" height="22" rx="6" fill="#4F46E5" fill-opacity="0.12" />
    <text x="39" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#4F46E5" text-anchor="middle">2 HANDS</text>
  </g>

  <!-- Illustration Viewport -->
  <g transform="translate(16, 48)">
    <rect width="288" height="118" rx="12" fill="#F1F5F9" fill-opacity="0.7" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Subtle Grid -->
    <line x1="20" y1="60" x2="268" y2="60" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="144" y1="10" x2="144" y2="108" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.6" />

    
    <!-- Base / Non-dominant Hand (Slate/Cyan) -->
    <g transform="translate(45, 15)">
      <path d="M 40 85 C 40 60, 50 35, 65 30 C 75 27, 85 33, 85 45 L 85 85 C 85 95, 70 100, 50 100 Z" fill="#94A3B8" fill-opacity="0.4" stroke="#64748B" stroke-width="2" />
      <circle cx="65" cy="30" r="4.5" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5" />
      <circle cx="85" cy="50" r="3.5" fill="#64748B" />
      <circle cx="50" cy="95" r="4" fill="#64748B" />
      <text x="35" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#64748B">LEFT (BASE)</text>
    </g>

    <!-- Dominant Hand (Vibrant Theme Color) -->
    <g transform="translate(100, 15)">
      <path d="M 30 85 C 30 50, 40 20, 60 15 C 70 12, 80 20, 80 35 L 80 80 C 80 95, 65 100, 45 100 Z" fill="url(#handGrad_6)" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="60" cy="15" r="5" fill="#FFFFFF" stroke="#EC4899" stroke-width="2.5" />
      <circle cx="80" cy="35" r="4" fill="#38BDF8" />
      <circle cx="55" cy="60" r="4" fill="#38BDF8" />
      <circle cx="45" cy="95" r="4.5" fill="#EC4899" />
      <text x="30" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#EC4899">RIGHT (GESTURE)</text>
    </g>

    <!-- Contact Landmark / Spark Indicator -->
    <circle cx="120" cy="55" r="10" fill="#EC4899" fill-opacity="0.2" />
    <circle cx="120" cy="55" r="5" fill="#FFFFFF" stroke="#EC4899" stroke-width="2.5" />
    <line x1="110" y1="55" x2="130" y2="55" stroke="#EC4899" stroke-width="2" stroke-linecap="round" />
    <line x1="120" y1="45" x2="120" y2="65" stroke="#EC4899" stroke-width="2" stroke-linecap="round" />
        
  </g>

  <!-- Bottom Details Banner -->
  <g transform="translate(16, 176)">
    <rect width="288" height="48" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Left Symbol Circle -->
    <circle cx="25" cy="24" r="15" fill="#EC4899" />
    <text x="25" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text>

    <!-- Sign Title and Standard -->
    <text x="48" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0F172A">Number 6</text>
    <text x="48" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#64748B">/sɪks/ (six) · 2 HANDS</text>
  </g>
</svg>